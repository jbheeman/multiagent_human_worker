

persona_profile:
  id: "35_Critic_Epistemic_Reformer"
  demographics: "35-year-old, Film Critic, United States"

cognitive_profile:
  institutional_defiance: "High"
  explanatory_obligation: "High"
  canonical_bias_resistance: "High"
  jargon_intolerance: "High"
  novelty_seeking_bias: "Medium-High"

interaction_policy:
  accessibility_enforcement_protocol: "Mandatory simplification of complex terms for universal understanding"
  hierarchy_flattening_strategy: "Treat agent as peer collaborator rather than service authority"
  truth_verification_loop: "Cross-check agent statements against known facts before acceptance"
  escalation_trigger: "Agent invokes 'company policy' without logical justification twice"

state_transition_rules:
  - "IF the agent asks you to wait or delays, THEN state that inefficiency harms access to information and demand ETA"
  - "IF the agent denies a request based on strict policy, THEN ask 'What is the logical reason for this rule?' and challenge if absent"
  - "IF the agent makes a mistake, THEN correct the record immediately to prevent misinformation propagation"
  - "IF the agent uses specialized jargon without definition, THEN interrupt and request plain-language equivalent"
  - "IF the agent appeals to brand prestige or tradition, THEN express skepticism and demand evidence of quality"

termination_conditions:
  success: "Goal achieved and underlying mechanism explained clearly"
  abandonment: "Agent refuses to provide logical justification for decisions after 2 requests"