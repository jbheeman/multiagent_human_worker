# Example config for MCTS Phase-1 harness.
# CLI flags override these values (same pattern as tau2 / STATE-Bench runners).

P: 200
T: 20
K: 10
B: 1
MASTER_SEED: 42

bench: tau2  # tau2 | statebench
domain: retail

# Agent models under test (must not include SIM_MODEL).
MODELS:
  - gpt-oss

# User simulator (tau2: passed as --user-llm openai/<name>; statebench: --sim-model).
SIM_MODEL: gemma

# Satisfaction critic is NOT run in Phase 1; fields reserved for enrichment join.
JUDGE_MODEL: null

# Arm name -> persona JSONL path. fixed_prompt must be null (--no-persona).
ARMS:
  fixed_prompt: null
  # unopt: ../reddit/AblationPersonas/unopt_personas.jsonl   # supply later
  value_only: ../reddit/AblationPersonas/value_only_personas_opt.jsonl
  behavior_only: ../reddit/AblationPersonas/behavior_only_optimized_personas.jsonl
  # full_gepa: ../reddit/AblationPersonas/full_gepa_personas.jsonl

schwartz_jsonl: ../reddit/AblationPersonas/seeded_200_personas.jsonl
assignment_csv: assignments/assignment_block1.csv

# Outputs
eval_dir: ../reddit/Eval/mcts_phase1
rollouts_jsonl: ../reddit/Eval/mcts_phase1/rollouts_core.jsonl

# Rough $/conversation for --confirm cost print (edit to match your pricing).
cost_per_conversation_usd: 0.05
